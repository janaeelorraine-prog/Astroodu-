document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eral, crystal, water, and item the work calls for. Add each one and write what it is, where it lives, and what it carries.' },\n      wildones:    { title: 'The Wild Ones', kicker: 'Sacred Animals · Birds · Fish', accent: '#A9B86A', types: ['wildone'], intro: 'The sacred animals, the birds, and the fish — the wild ones who carry medicine and message. Add each and write its nature, its waters, and what it brings.' },\n      dict:        { title: 'The Sacred Dictionary', kicker: 'Every Sacred Word', accent: '#F6D27E', types: ['term', 'pillar'], intro: 'The living tongue of AstroOdu — the pillars, the elements, the number-law, and every sacred word. Define each in plain words and in full.' },\n      examples:    { title: 'Reading Examples', kicker: 'Charts in Practice', accent: '#E0966F', types: ['reading'], intro: 'Real skies read all the way through. Add an example — the chart and the person, then the full reading you would give on camera.' },\n    };\n  }\n\n  typeMeta() {\n    return {\n      odu:    { label: 'Odu', fields: [['name','Name','e.g. Ogbe'],['seniority','Seniority number','its place in the order, 1–16'],['element','Element','Fire / Earth / Water / Air'],['knock','Knock','how it announces itself'],['praise','Praise / opening','the opening words'],['core','Core teaching','what this Odu teaches',1],['pataki','Pataki — the story','the sacred story it carries',1],['carriers','Spirits who carry it','which spirits speak through it'],['rules','Gates it rules','the gates under its hand'],['notes','Notes','anything else worth keeping',1]] },\n      throne: { label: 'Throne', fields: [['name','Name','e.g. Heart'],['region','Body region','where it sits in the body'],['core','Core teaching','what this throne governs',1],['eligible','Spirits eligible for the seat','who may be seated here'],['ground','Element ground','its elemental footing'],['notes','Notes','anything else worth keeping',1]] },\n      spirit: { label: 'Spirit / Deity', fields: [['name','Name','e.g. Oshun'],['traditions','Tradition(s) of origin','Yoruba, Lukumí, Vodou, Candomblé…'],['element','Element','its element'],['odu','Odu landing','the Odu it lands in'],['throne','Throne','the throne it takes'],['knock','Knock number','the number it knocks at'],['quality','Quality number','its quality number'],['tradnum','Tradition number','its tradition number'],['praise','Praise','how it is praised / saluted'],['pataki','Pataki — the story','the sacred story this spirit carries, in full',1],['properties','Properties','herbs, colors, days, offerings',1],['kin','Kin','its family, roads, and consorts'],['notes','Notes','anything else worth keeping',1]] },\n      gate:   { label: 'Gate', fields: [['name','Name','name this gate'],['number','Number','1–48'],['degrees','Degrees','the span of sky it holds'],['sign','Sign','the sign it falls in'],['room','Room','its room on the Wheel'],['odu','Odu','the Odu it answers to'],['notes','Notes','anything else worth keeping',1]] },\n      pillar: { label: 'Pillar', fields: [['name','Name','Nature / Trap / Soul'],['plain','Plain-words teaching','say it simply',1],['deeper','Deeper teaching','say it fully',1]] },\n      remedy: { label: 'Remediation', fields: [['name','Name','name of the work'],['forwhat','For','what it answers or cures'],['materials','Materials','herbs, waters, items',1],['method','Method','how it is done, step by step',1],['spirits','Spirits','who it calls on'],['notes','Notes','anything else worth keeping',1]] },\n      earthbone: { label: \"Earth's Bone\", fields: [['name','Name','e.g. River stone, Basil, Honey'],['kind','Kind','herb / mineral / crystal / water / item'],['element','Element','its element'],['spirits','Spirits','who it belongs to / calls on'],['properties','Properties','colors, days, how it is used',1],['sourcing','Where it lives','where it is found or gathered'],['uses','Used in','the works and remedies it serves',1],['notes','Notes','anything else worth keeping',1]] },\n      wildone: { label: 'Wild One', fields: [['name','Name','e.g. Vulture, Catfish, Snake'],['kind','Kind','animal / bird / fish / reptile / insect'],['element','Element','its element'],['spirits','Spirits','who it serves / belongs to'],['odu','Odu','the Odu it speaks in'],['medicine','Medicine / message','what it carries, its omen',1],['offering','As offering / taboo','where it is given or forbidden',1],['notes','Notes','anything else worth keeping',1]] },\n      term:   { label: 'Term', fields: [['name','Term','the sacred word'],['plain','Plain-words teaching','what it means, simply',1],['deeper','Deeper teaching','its fuller meaning and use',1]] },\n      reading:{ label: 'Reading Example', fields: [['name','Title','name this reading'],['setup','The sky / setup','the chart, the person, the moment',1],['reading','The reading','how it was read, all the way through',1],['notes','Notes','what to point out when teaching',1]] },\n    };\n  }\n\n  relGroups() {\n    return [\n      ['Spirit ties', ['Consort', 'Sibling', 'Parent/Child', 'Road/Camino', 'Ally', 'Rival']],\n      ['General ties', ['Carries', 'Sits at', 'Rules', 'Belongs to', 'Related']],\n    ];\n  }\n\n  // ---------- persistence ----------\n  uid() { return 'e_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\n\n  seed() {\n    const entries = {};\n    const mk = (type, name, extra) => { const id = this.uid(); entries[id] = { id, type, fields: Object.assign({ name }, extra || {}) }; };\n    ['Ogbe','Oyeku','Iwori','Odi','Irosun','Owonrin','Obara','Okanran','Ogunda','Osa','Ika','Oturupon','Otura','Irete','Oshe','Ofun'].forEach((n, i) => mk('odu', n, { seniority: String(i + 1) }));\n    ['Crown','Brow','Throat','Heart','Gut','Navel','Womb-Space','Hips','Root','Thighs','Knees','Feet'].forEach(n => mk('throne', n));\n    for (let i = 1; i <= 48; i++) mk('gate', 'Gate ' + String(i).padStart(2, '0'), { number: String(i) });\n    ['Nature','Trap','Soul'].forEach(n => mk('pillar', n));\n    ['Fire','Earth','Water','Air'].forEach(n => mk('term', n));\n    ['Knock','Odu Landing','Quality Number','Tradition Number'].forEach(n => mk('term', n));\n    ['The Surface Wheel','The 256'].forEach(n => mk('term', n));\n    return { entries, links: [], v: 1 };\n  }\n\n  componentDidMount() {\n    let data = null;\n    try { const raw = localStorage.getItem('astroodu_teaching_v1'); if (raw) data = JSON.parse(raw); } catch (e) {}\n    if (!data || !data.entries) data = this.seed();\n    if (!data.links) data.links = [];\n    this.setState({ data });\n    this.save(data);\n  }\n\n  save(d) { try { localStorage.setItem('astroodu_teaching_v1', JSON.stringify(d || this.state.data)); } catch (e) {} }\n\n  // ---------- navigation ----------\n  openCat(catId) { this.setState({ mode: 'cat', catId, entryId: null, editingField: null }); window.scrollTo(0, 0); }\n  openEntry(entryId) { const e = this.state.data.entries[entryId]; this.setState({ mode: 'entry', entryId, catId: e ? this.catForType(e.type) : this.state.catId, editingField: null, lt: '', lr: 'Related' }); window.scrollTo(0, 0); }\n  openConnector() { this.setState({ mode: 'connector', editingField: null, la: '', lb: '', lr: 'Related' }); window.scrollTo(0, 0); }\n  back() { if (this.state.mode === 'entry') this.openCat(this.state.catId || this.catForType(this.state.data.entries[this.state.entryId].type)); else this.setState({ mode: 'hub', editingField: null }); }\n  goHub() { this.setState({ mode: 'hub', editingField: null }); }\n\n  catForType(type) { const m = this.catMeta(); for (const k in m) if (m[k].types.indexOf(type) >= 0) return k; return 'dict'; }\n\n  // ---------- mutations ----------\n  setField(id, key, val) { const d = this.state.data; d.entries[id].fields[key] = val; this.setState({ data: d }); this.save(d); }\n  addEntry(type) { const d = this.state.data; const id = this.uid(); d.entries[id] = { id, type, fields: { name: '' } }; this.setState({ data: d, mode: 'entry', entryId: id, editingField: id + '::name', lt: '', lr: 'Related' }); this.save(d); window.scrollTo(0, 0); }\n  deleteEntry(id) { const d = this.state.data; const cat = this.catForType(d.entries[id].type); delete d.entries[id]; d.links = d.links.filter(l => l.a !== id && l.b !== id); this.setState({ data: d, mode: 'cat', catId: cat, entryId: null }); this.save(d); }\n  registerWord(name) { name = (name || '').trim(); if (!name) return; const d = this.state.data; const id = this.uid(); d.entries[id] = { id, type: 'term', fields: { name } }; this.setState({ data: d }); this.save(d); }\n  addLink(a, b, rel) { if (!a || !b || a === b) return; const d = this.state.data; if (!d.links.some(l => (l.a === a && l.b === b) || (l.a === b && l.b === a))) { d.links.push({ a, b, rel: rel || 'Related' }); this.setState({ data: d }); this.save(d); } }\n  removeLink(a, b) { const d = this.state.data; d.links = d.links.filter(l => !((l.a === a && l.b === b) || (l.a === b && l.b === a))); this.setState({ data: d }); this.save(d); }\n\n  // ---------- helpers ----------\n  entriesOfCat(catId) { const types = this.catMeta()[catId].types; return Object.values(this.state.data.entries).filter(e => types.indexOf(e.type) >= 0); }\n  words() { return Object.values(this.state.data.entries).filter(e => e.fields.name && e.fields.name.trim()).map(e => ({ id: e.id, name: e.fields.name.trim() })); }\n  connectionsFor(id) { return this.state.data.links.filter(l => l.a === id || l.b === id).map(l => ({ otherId: l.a === id ? l.b : l.a, rel: l.rel })); }\n\n  linkify(text, selfId) {\n    const h = React.createElement;\n    if (!text) return text;\n    const ws = this.words().filter(w => w.id !== selfId).sort((a, b) => b.name.length - a.name.length);\n    if (!ws.length) return text;\n    const esc = s => s.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n    let re;\n    try { re = new RegExp(\"\\\\b(\" + ws.map(w => esc(w.name)).join(\"|\") + \")(?:['’]s|s)?\\\\b\", \"gi\"); } catch (e) { return text; }\n    const out = []; let last = 0, m, i = 0;\n    while ((m = re.exec(text))) {\n      if (m.index > last) out.push(text.slice(last, m.index));\n      const matched = m[0];\n      const baseName = (m[1] || matched).toLowerCase();\n      const tgt = ws.find(w => w.name.toLowerCase() === baseName);\n      if (!tgt) { out.push(matched); last = m.index + matched.length; if (re.lastIndex === m.index) re.lastIndex++; continue; }\n      out.push(h('a', { key: 'k' + (i++), onClick: (ev) => { ev.stopPropagation(); this.openEntry(tgt.id); }, style: { color: '#F2D08A', textDecoration: 'none', borderBottom: '1px solid rgba(242,208,138,.45)', cursor: 'pointer' } }, matched));\n      last = m.index + matched.length;\n      if (re.lastIndex === m.index) re.lastIndex++;\n    }\n    if (last < text.length) out.push(text.slice(last));\n    return out;\n  }\n\n  // ---------- shared chrome ----------\n  topBar(crumb, accent) {\n    const h = React.createElement;\n    const btn = (label, onClick, extra) => h('div', { onClick, style: Object.assign({ display: 'flex', alignItems: 'center', gap: '7px', cursor: 'pointer', padding: '8px 15px', borderRadius: '30px', border: '1px solid rgba(232,184,100,.28)', background: 'rgba(232,184,100,.05)', fontSize: '12px', fontWeight: 600, color: '#E8B864', letterSpacing: '.02em' }, extra || {}) }, label);\n    return h('div', { style: { position: 'sticky', top: 0, zIndex: 20, display: 'flex', alignItems: 'center', gap: '12px', padding: '18px 40px', background: 'rgba(10,8,22,.82)', backdropFilter: 'blur(12px)', borderBottom: '1px solid rgba(232,184,100,.14)' } },\n      btn([h('span', { key: 'a', style: { fontSize: '15px', lineHeight: 1 } }, '←'), h('span', { key: 'b' }, 'Teaching Hub')], () => this.goHub(), { paddingLeft: '12px' }),\n      crumb ? h('span', { key: 'c', style: { color: '#6b6480', fontSize: '13px' } }, '›') : null,\n      crumb ? h('span', { key: 'd', style: { fontFamily: \"'Cormorant Garamond',serif\", fontStyle: 'italic', fontSize: '20px', color: '#cfc6dd' } }, crumb) : null,\n      h('div', { key: 'sp', style: { flex: 1 } }),\n      h('div', { key: 'conn', onClick: () => this.openConnector(), style: { display: 'flex', alignItems: 'center', gap: '7px', cursor: 'pointer', padding: '8px 15px', borderRadius: '30px', border: '1px solid rgba(95,184,160,.32)', background: 'rgba(95,184,160,.06)', fontSize: '12px', fontWeight: 600, color: '#7FD0BB' } }, '✦ Connector'),\n      h('div', { key: 'exp', onClick: () => this.exportJSON(), style: { cursor: 'pointer', padding: '8px 15px', borderRadius: '30px', border: '1px solid rgba(232,184,100,.22)', fontSize: '12px', fontWeight: 600, color: '#cdb98a' } }, '↓ Export'),\n      h('label', { key: 'imp', style: { cursor: 'pointer', padding: '8px 15px', borderRadius: '30px', border: '1px solid rgba(232,184,100,.22)', fontSize: '12px', fontWeight: 600, color: '#cdb98a' } }, '↑ Import',\n        h('input', { type: 'file', accept: 'application/json', onChange: (e) => this.importFile(e), style: { display: 'none' } })),\n      h('div', { key: 'rec', style: { display: 'flex', alignItems: 'center', gap: '8px', padding: '7px 14px', borderRadius: '30px', background: 'rgba(232,80,80,.12)', border: '1px solid rgba(232,80,80,.34)' } },\n        h('span', { style: { width: '8px', height: '8px', borderRadius: '50%', background: '#e85050', animation: 'orbglow 2.4s ease-in-out infinite' } }),\n        h('span', { style: { fontSize: '11px', fontWeight: 700, letterSpacing: '.16em', textTransform: 'uppercase', color: '#f0a0a0' } }, 'Record')));\n  }\n\n  exportJSON() {\n    const blob = new Blob([JSON.stringify(this.state.data, null, 2)], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a'); a.href = url; a.download = 'astroodu-backup.json'; a.click();\n    setTimeout(() => URL.revokeObjectURL(url), 1500);\n  }\n  importFile(ev) {\n    const file = ev.target.files && ev.target.files[0]; if (!file) return;\n    const r = new FileReader();\n    r.onload = () => { try { const d = JSON.
